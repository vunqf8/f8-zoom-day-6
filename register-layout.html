<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Layout</title>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&amp;family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container-register">
      <div class="wrapper">
        <h1>Register</h1>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio,
          nesciunt?
        </p>
        <form action="" autocomplete="off">
          <div class="form-group">
            <input type="email" placeholder=" " required />
            <label for="email">Email</label>
          </div>
          <div class="form-group">
            <input type="password" placeholder=" " required />
            <label for="password">Password</label>
          </div>
          <div class="form-group">
            <input type="password" placeholder=" " required />
            <label for="retype-password">Re-type Password</label>
          </div>
          <div class="checkbox">
            <label for="retype-password">Agree our Term and Conditions</label>
            <input type="checkbox" placeholder=" " id="retype-password" />
          </div>
          <button type="submit">Register</button>
        </form>
        <span class="or">--- or ---</span>
        <div class="register-with">
          <button class="facebook">
            <span><i class="fa-brands fa-facebook-f"></i></span>
            <span>Register with Facebook</span>
          </button>
          <button class="twitter">
            <span><i class="fa-brands fa-twitter"></i></span>
            <span>Register with Twitter</span>
          </button>
          <button class="google">
            <span><i class="fa-brands fa-google"></i></span>
            <span>Register with Google</span>
          </button>
        </div>
      </div>
      <img src="./img/bg-city.jpg" alt="Background City" />
    </div>
  </body>
</html>
